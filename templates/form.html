{% extends "base.html" %}
{% block conteudo %}
<h1>{{ titulo }}</h1>

{% for e in erros %}
  <p class="erro">{{ e }}</p>
{% endfor %}

<form method="post" class="formulario">
  <label>Tipo
    <select name="tipo">
      <option value="saida" {{ 'selected' if dados.tipo == 'saida' }}>Saída</option>
      <option value="entrada" {{ 'selected' if dados.tipo == 'entrada' }}>Entrada</option>
    </select>
  </label>

  <label>Valor (R$)
    <input type="text" name="valor" inputmode="decimal"
           value="{{ '%.2f'|format(dados.valor)|replace('.', ',') if dados.valor is number else dados.valor }}"
           placeholder="0,00">
  </label>

  <label>Categoria / Etiqueta livre (opcional — escreva o que quiser)
    <input type="text" name="categoria" value="{{ dados.categoria }}" placeholder="Ex.: Salário, Mercado, Freelance, Casa...">
  </label>

  <label>Data
    <input type="date" name="data" value="{{ dados.data }}">
  </label>

  <label>Descrição (opcional)
    <input type="text" name="descricao" value="{{ dados.descricao or '' }}">
  </label>

  <div class="botoes">
    <button type="submit" class="botao">Salvar</button>
    <a href="{{ url_for('lancamentos') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
