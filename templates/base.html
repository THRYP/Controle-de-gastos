<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle de Gastos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}" class="logo">Controle de Gastos</a>
    <a href="{{ url_for('novo') }}" class="botao">+ Novo</a>
  </header>
  <main>
    {% with mensagens = get_flashed_messages() %}
      {% for m in mensagens %}
        <p class="aviso">{{ m }}</p>
      {% endfor %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
